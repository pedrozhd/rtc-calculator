# Backends oficiais da Receita que não têm API pública (o regime regular usa a API pública).
# Uso local: docker compose -f backends/docker-compose.yml up --build
services:
  simples-nacional:
    build: ./simples-nacional
    ports:
      - "8082:8082"
  danfse:
    build: https://github.com/ReceitaFederal/calculadora-rtc-gerador-danfse.git
    ports:
      - "8081:8080"
